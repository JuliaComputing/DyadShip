[parameters.R2]
unit = "N s^2/m^2"
printed = "R'0 = 0.022"
origin = "(1/2) rho Lpp d R'0 with rho = 1025 kg/m^3: 0.5 x 1025 x 320 x 20.8 x 0.022 = 75046.4. R1 = R3 = 0. The source multiplies R'0 by the total speed squared; HydrodynamicXYY uses the surge speed, a known limitation of that component. R'0 = 0.022 is the resistance coefficient of the captive model. For its full-scale simulations the source states (journal p. 48, PDF p. 12) that hull resistance was calculated by a 3-dimensional extrapolation method based on Schoenherr's frictional resistance coefficient formula, and prints neither the result nor the form factor. Used at full scale this value asks for 6.1 MN of thrust and 79 MW at 15.5 kn."
page = "journal p. 47 (PDF p. 11), Table 2"

[parameters.derivatives]
unit = "1"
printed = "X'vv -0.040, X'vr 0.002, X'rr 0.011, X'vvvv 0.771, Y'v -0.315, Y'R 0.083, Y'vvv -1.607, Y'vvr 0.379, Y'vrr -0.391, Y'rrr 0.008, N'v -0.137, N'R -0.049, N'vvv -0.030, N'vvr -0.294, N'vrr 0.055, N'rrr -0.013"
origin = "Table 3 'Hydrodynamic force coefficients used in the simulations', copied. These are the hull-only values: Table 2 prints the measured combinations that still contain mass terms (for example X'vr + m' + m'y = 0.518, Y'R - m' - m'x = -0.233). The source's axes are y to starboard and yaw to starboard; this library's are y to port and yaw to port. Reversing both v and r leaves every coefficient unchanged, because the Y and N polynomials are odd and the X polynomial even in (v, r) together."
page = "journal p. 49 (PDF p. 13), Table 3"

[[not_representable]]
item = "propeller wake change with drift, (1 - wP)/(1 - wP0) of Eq. 16 with C1 = 2.0, C2 = 1.6 / 1.1"
status = "Ship6DOF.Propeller1Q has a constant wake fraction"

[[not_representable]]
item = "MMG rudder model: tR = 0.387, x'H = -0.464, epsilon = 1.09, kappa = 0.50, l'R = -0.710, f_alpha = 2.747"
status = "Ship6DOF.Rudder computes lift and drag from NACA 0015 tables and its own slipstream model; it takes the rudder area and height, aH = 0.312 and the flow-straightening coefficients, but not these six. The source gives gamma_R = 0.395 for beta_R < 0 and 0.640 for beta_R > 0 in axes positive to starboard (Table 3, journal p. 49), that is 0.395 in a port turn and 0.640 in a starboard turn. Rudder selects Gamma_R_Neg when its own inflow angle is positive, which is the case in a port turn, so KVLCC2Ship sets Gamma_R_Neg = 0.395 and Gamma_R_Pos = 0.640."

