[alternatives.propeller_torque]
used_by = "DyadShip.Ship6DOF.KVLCC2Hull (Propeller1Q Kq0, Kq1, Kq2)"
value = "Kq = 0.030710 - 0.018559 J - 0.020451 J^2"
origin = "least-squares quadratic through the 19 points of the 10KQ column of SIMMAN2008-POT, divided by 10; largest residual 2.7e-4 in KQ. The same fit of the KT column gives 0.29313, -0.27527, -0.13850, the thrust polynomial of YY2015 to four digits, so the two come from the same test."
calibration_status = "fitted"

[alternatives.full_scale_resistance]
used_by = "DyadShip.Ship6DOF.PoweredKVLCC2Ship (R2_resistance)"
value = "R2 = 26908.9 N s^2/m^2 (R'0 = 0.007888)"
origin = "The method YY2015 names for its full-scale runs, repeated with public numbers. Model total coefficient on the wetted surface: C_T = R'0 Lpp d / S = 0.022 x 6656 / 27194 = 5.3847e-3. Schoenherr friction coefficient, 0.242 / sqrt(C_F) = log10(Re C_F): model Re = 0.760 x 2.9091 / 1.139e-6 = 1.941e6 gives 3.8934e-3; ship Re = 7.9739 x 320 / 1.188e-6 = 2.148e9 gives 1.3960e-3. With the wave-making part taken as zero the whole coefficient scales with friction: 5.3847e-3 x 1.3960 / 3.8934 = 1.9308e-3. R2 = (1/2) x 1025 x 27194 x 1.9308e-3 = 26908.9. Resistance 1.711 MN and effective power 13.64 MW at 15.5 kn."
assumptions = "wave-making resistance zero (form factor 1.383 follows); kinematic viscosity 1.139e-6 m^2/s for the model test and 1.188e-6 for the sea; model speed 0.760 m/s; no roughness or correlation allowance; no air resistance"
bounds = "With the form factor unknown this is the low end. The two-dimensional (Froude) extrapolation of the same numbers, C_T = 1.3960e-3 + (5.3847e-3 - 3.8934e-3) = 2.8873e-3, gives R2 = 40240.7 and 2.559 MN at 15.5 kn."
calibration_status = "fitted"
status_note = "an estimate by a stated method, not a published powering prediction; none was found for this hull"

