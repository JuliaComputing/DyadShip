# Provenance sidecar. NOT a parameter file: never reference it in an apply clause.
schema = "dyadship.provenance/1"
asset = "kvlcc2_full_scale.toml"
component = "DyadShip.Ship6DOF.HydrodynamicXYY"
calibration_status = "transcribed"
manufacturer = "none"
model = "KVLCC2 (research tanker hull form; no ship of this form was built)"
description = "Full-scale principal particulars with the non-dimensional resistance coefficient, added-mass coefficients and hull hydrodynamic derivatives of the source. The added masses and derivatives come from captive tests of a 2.902 m model and are applied unchanged at full scale, as the source does. The resistance coefficient is the MODEL value: the source did not use it at full scale (see parameters.R2 and alternatives.full_scale_resistance)."
reference_conditions = "Deep, calm water; design draft 20.8 m, even keel; forces non-dimensionalised by (1/2) rho Lpp d U^2 and moments by (1/2) rho Lpp^2 d U^2, taken at midship."
uncertainty = "The source states no uncertainty for the coefficients. Its own simulation is up to 5.8 % above its free-running model test in the turning indices."

